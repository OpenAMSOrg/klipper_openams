# Optional gco-routines opt-in for the OpenAMS toolchange.
#
# Include this file only when the gco-routines extension is enabled:
# [gco_routines] must come before every gcode_macro section in printer.cfg,
# and this include goes right after [include oams_macros.cfg]. Klipper merges
# this section into _TX, which then overlaps OpenAMS loading with CLEAN_NOZZLE.
# Stock Klipper rejects render_mode, so never include this file without the
# extension. Without it, oams_macros.cfg runs serially and unchanged.
[gcode_macro _TX]
render_mode: ordered
